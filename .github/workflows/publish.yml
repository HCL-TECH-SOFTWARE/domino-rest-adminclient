name: Publish package to Github registry

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to ghcr.io
    runs-on: ubuntu-latest
    env:
      REACT_APP_ADMIN_UI_BUILD_VERSION: ${{ github.run_number }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-java@v6
        with:
          java-version: 8
          distribution: 'temurin'
      - run: mvn --no-transfer-progress clean
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: Publish test coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Test Coverage Summary"
              echo ""
              echo "| Metric | Coverage | Covered/Total |"
              echo "| --- | --- | --- |"
              jq -r '.total as $t | ["lines","statements","functions","branches"][] | . as $k | $t[$k] | "| \($k) | \(.pct)% | \(.covered)/\(.total) |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report not found." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish mvn to GitHub Packages
        run: mvn --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
