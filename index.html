<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="HCL Domino REST API Admin" content="Admin Client for HCL Domino REST API" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The admin-ui-daily-build-version meta tag is injected by the stampBuildVersion()
      plugin in vite.config.mts. It is deliberately absent here: it is build output, and
      a build step that edits this tracked file leaves the working tree dirty every run.
    -->
    <title>HCL Domino Rest API</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply theme before React renders to prevent flash
      // TODO: simplify after wa transition to wa-dark
      (function () {
        const theme = localStorage.getItem('theme');
        const isDark = theme === 'dark';
        if (isDark) {
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.classList.add('wa-dark');
          document.body.dataset.theme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.classList.remove('wa-dark');
        }
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
